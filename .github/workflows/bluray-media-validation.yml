name: Blu-ray native media validation

on:
  pull_request:
    paths:
      - 'android/native/bluray_mkv_core.c'
      - 'android/native/bluray_mkv_core.h'
      - 'android/native/tests/test-bluray-media.sh'
      - 'android/native/tests/bluray_mkv_media_harness.c'
      - '.github/workflows/bluray-media-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authored-bdmv-and-iso:
    name: Authored BDMV / ISO to Matroska sample parity
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install host native engine and Blu-ray authoring prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libbluray-dev libavformat-dev libavcodec-dev \
            libavutil-dev libswresample-dev pkg-config unzip curl
      - name: Exercise native Blu-ray core on authored BDMV and ISO
        run: bash android/native/tests/test-bluray-media.sh
