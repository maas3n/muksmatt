name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false

      - name: Install FFmpeg for merger integration tests
        run: choco install ffmpeg --no-progress -y

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Test All-in-One chooser responsiveness
        working-directory: packaging/all-in-one
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force assets | Out-Null
          Set-Content assets/muKsMaTT-Portable.zip 'test payload'
          Set-Content assets/muKsMaTT-Thin-Setup.exe 'test payload'
          go test -v main.go main_test.go
          if ($LASTEXITCODE -ne 0) { throw 'All-in-One chooser test failed' }

      - name: Build Windows GUI
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          go build -trimpath -buildvcs=false -ldflags "-s -w -H=windowsgui" -o ..\muksmatt.exe .
          Copy-Item .\muksmatt.exe.manifest ..\muksmatt.exe.manifest -Force
          Get-FileHash ..\muksmatt.exe -Algorithm SHA256

      - name: Build and smoke-test Windows batch CLI
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          go build -trimpath -buildvcs=false -tags cli -ldflags "-s -w" -o ..\muksmatt-cli.exe .
          & ..\muksmatt-cli.exe --version
          $help = (& ..\muksmatt-cli.exe 2>&1 | Out-String)
          foreach ($feature in @('--batch', '--streams', '--no-chapters', 'scan', 'metadata', 'remux')) { if (-not $help.Contains($feature)) { throw "CLI help missing $feature" } }
          Get-FileHash ..\muksmatt-cli.exe -Algorithm SHA256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: muKsMaTT-windows-amd64
          path: |
            muksmatt.exe
            muksmatt.exe.manifest
            muksmatt-cli.exe
