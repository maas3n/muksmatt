name: Unified release

# Production publishing is opt-in only: never publish on a push or tag.
# The default/absent repository variable is fail-closed.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing unified release tag. Leave blank to rebuild the rolling main downloads.'
        required: false
        type: string
      confirm_publish:
        description: 'I explicitly authorize publishing the selected muKsMaTT release.'
        required: true
        type: boolean
        default: false

# Serialize channels and never cancel a publisher midway through publication.
concurrency:
  group: unified-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  FFMPEG_VERSION: '9.0.1'
  ANDROID_NDK_VERSION: '30.0.16248370'

jobs:
  metadata:
    # Both approvals are required; skipped metadata skips every dependent build/publish job.
    if: ${{ inputs.confirm_publish == true && vars.MUKSMATT_RELEASE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.meta.outputs.mode }}
      tag: ${{ steps.meta.outputs.tag }}
      source_ref: ${{ steps.meta.outputs.source_ref }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      android_version_code: ${{ steps.meta.outputs.android_version_code }}
      windows_numeric_version: ${{ steps.meta.outputs.windows_numeric_version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' && inputs.tag || github.sha }}

      - name: Resolve release mode and version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          event='${{ github.event_name }}'
          input_tag='${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}'

          if [[ "$event" == "workflow_dispatch" && -z "$input_tag" && '${{ github.ref_name }}' != "main" ]]; then
            echo "A blank tag rebuilds main downloads and must be dispatched from the main branch." >&2
            exit 1
          fi

          if [[ ( "$event" == "push" && '${{ github.ref }}' == "refs/heads/main" ) || ( "$event" == "workflow_dispatch" && -z "$input_tag" ) ]]; then
            mode=main
            tag=main-downloads
            source_ref="$GITHUB_SHA"
            version="0.0.0-dev.${GITHUB_RUN_NUMBER}"
            prerelease=true
            windows_numeric_version="0.0.0.0"
          else
            mode=release
            tag="${input_tag:-$GITHUB_REF_NAME}"
            source_ref="$tag"

            if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-(alpha|beta|rc)\.([0-9]+))?$ ]]; then
              echo "Unsupported release tag: $tag" >&2
              echo "Use vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-{alpha,beta,rc}.N" >&2
              exit 1
            fi

            major=$((10#${BASH_REMATCH[1]}))
            minor=$((10#${BASH_REMATCH[2]}))
            patch=$((10#${BASH_REMATCH[3]}))
            channel="${BASH_REMATCH[5]:-}"
            sequence="${BASH_REMATCH[6]:-}"

            (( major <= 200 && minor <= 99 && patch <= 99 )) || {
              echo "Version components exceed the supported release bounds." >&2
              exit 1
            }

            prerelease=false
            if [[ -n "$channel" ]]; then
              sequence=$((10#$sequence))
              (( sequence >= 1 && sequence <= 99 )) || {
                echo "Pre-release sequence must be between 1 and 99." >&2
                exit 1
              }
              prerelease=true
            fi

            version="${tag#v}"
            windows_numeric_version="${major}.${minor}.${patch}.0"
            git rev-parse --verify "refs/tags/${tag}^{commit}" >/dev/null
          fi

          android_version_code="$(python3 scripts/release_version.py)"

          {
            echo "mode=$mode"
            echo "tag=$tag"
            echo "source_ref=$source_ref"
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "android_version_code=$android_version_code"
            echo "windows_numeric_version=$windows_numeric_version"
          } >> "$GITHUB_OUTPUT"
  signing-preflight:
    needs: metadata
    runs-on: ubuntu-latest
    environment: android-release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.source_ref }}
      - name: Check app-signing configuration before building any platform
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_APP_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_APP_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_APP_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_APP_SIGNING_KEY_PASSWORD }}
          CERT_SHA256: ${{ vars.ANDROID_APP_SIGNING_CERT_SHA256 }}
        run: python3 scripts/check_signing_environment.py

  windows:
    needs: [metadata, signing-preflight]
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.source_ref }}

      - name: Set up Go 1.27.1
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false

      - name: Set up MSYS2 MinGW64 for libdvdcss
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            coreutils
            curl
            file
            tar
            xz
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-libbluray
            mingw-w64-x86_64-libaacs
            mingw-w64-x86_64-libbdplus

      - name: Build pinned Windows libdvdcss runtime
        shell: msys2 {0}
        run: |
          set -euo pipefail
          prefix="$(cygpath -u "$RUNNER_TEMP")/muksmatt-libdvdcss"
          work="$(cygpath -u "$RUNNER_TEMP")/muksmatt-libdvdcss-work"
          LIBDVDCSS_PREFIX="$prefix" LIBDVDCSS_WORK="$work" bash scripts/build-libdvdcss.sh
          dll="$(find "$prefix" -type f -iname 'libdvdcss*.dll' -print -quit)"
          test -n "$dll"
          file "$dll"

      - name: Build Windows native Blu-ray navigator
        id: bluray_nav
        shell: msys2 {0}
        run: |
          set -euo pipefail
          nav="$(cygpath -u "$RUNNER_TEMP")/muksmatt-bluray-nav.exe"
          cc -O2 -Wall -Wextra -Werror -o "$nav" tools/bluray/bluray_nav.c $(pkg-config --cflags --libs libbluray)
          test "$("$nav" --version)" = "MUKSMATT_BD_NAV_1"
          echo "nav_exe=$(cygpath -w "$nav")" >> "$GITHUB_OUTPUT"
          echo "mingw_bin=$(cygpath -w /mingw64/bin)" >> "$GITHUB_OUTPUT"
          echo "objdump=$(cygpath -w /mingw64/bin/objdump.exe)" >> "$GITHUB_OUTPUT"

      - name: Test and build Windows GUI
        shell: pwsh
        working-directory: src
        run: |
          $ErrorActionPreference = 'Stop'
          $env:MATTRIP_VERSION = '${{ needs.metadata.outputs.version }}'
          go test ./...
          go vet ./...
          .\build.ps1

      - name: Prepare pinned bundled runtime tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $miVersion = '26.05'
          $miAsset = 'MediaInfo_CLI_26.05_Windows_x64.zip'
          $miSha = 'f7f80620ce6d14f4995f0de6f98e3ef18ad29496db01899571152ee3311229f9'
          $work = Join-Path $env:RUNNER_TEMP 'muksmatt-bundled-tools'
          $stage = Join-Path $PWD 'packaging\installer\bundled-tools'
          Remove-Item $work,$stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $work,$stage | Out-Null
          $blurayDest = Join-Path $stage 'bluray-nav'
          python packaging/windows/stage-bluray-windows.py --helper '${{ steps.bluray_nav.outputs.nav_exe }}' --mingw-bin '${{ steps.bluray_nav.outputs.mingw_bin }}' --objdump '${{ steps.bluray_nav.outputs.objdump }}' --dest $blurayDest
          if ($LASTEXITCODE -ne 0) { throw 'Windows Blu-ray runtime staging failed' }
          & (Join-Path $blurayDest 'muksmatt-bluray-nav.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'Staged native Blu-ray navigator failed' }


          function Assert-Sha([string]$Path,[string]$Expected) {
            $got = (Get-FileHash -Algorithm SHA256 -LiteralPath $Path).Hash.ToLowerInvariant()
            if ($got -ne $Expected.ToLowerInvariant()) {
              throw "SHA-256 mismatch for $Path`nExpected: $Expected`nActual:   $got"
            }
          }

          # The daily upstream archive has expired. Recover the exact runtime
          # from our immutable, checksum-verified portable release.
          $ffArchive = Join-Path $work 'MattMux-1.4.13-Windows-Portable.zip'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/maas3n/MattMux/releases/download/v1.4.13/MattMux-1.4.13-Windows-Portable.zip' -OutFile $ffArchive
          Assert-Sha $ffArchive '9a8127fb60684e86a3550d30a9f74ad9494a654218ad671d4c4527b0503d6bc9'
          $ffExtract = Join-Path $work 'ffmpeg'
          Expand-Archive -LiteralPath $ffArchive -DestinationPath $ffExtract -Force
          $ffmpeg = Get-ChildItem $ffExtract -Filter ffmpeg.exe -File -Recurse | Select-Object -First 1
          if ($null -eq $ffmpeg) { throw 'ffmpeg.exe missing from verified archive' }
          $ffBin = $ffmpeg.Directory.FullName
          if (-not (Test-Path (Join-Path $ffBin 'ffprobe.exe'))) { throw 'ffprobe.exe missing from verified archive' }
          $ffDest = Join-Path $stage 'ffmpeg-2026-09-08'
          New-Item -ItemType Directory -Force -Path $ffDest | Out-Null
          Copy-Item (Join-Path $ffBin '*') $ffDest -Force
          # Static FFmpeg/libbluray loads AACS and BD+ libraries dynamically.
          # Keep them beside private FFmpeg, never in system directories.
          Get-ChildItem $blurayDest -Filter '*.dll' -File | ForEach-Object {
            Copy-Item $_.FullName $ffDest -Force
          }


          $cssRoot = Join-Path $env:RUNNER_TEMP 'muksmatt-libdvdcss'
          $cssDll = Get-ChildItem $cssRoot -Filter 'libdvdcss*.dll' -File -Recurse | Select-Object -First 1
          if ($null -eq $cssDll) { throw 'libdvdcss DLL missing from pinned build' }
          Copy-Item $cssDll.FullName (Join-Path $ffDest 'libdvdcss-2.dll') -Force
          $cssNoticeRoot = Join-Path $cssRoot 'share\muksmatt\libdvdcss'
          $cssLicenseDir = Join-Path $ffDest 'licenses\libdvdcss'
          New-Item -ItemType Directory -Force -Path $cssLicenseDir | Out-Null
          Copy-Item (Join-Path $cssNoticeRoot 'COPYING') $cssLicenseDir -Force
          Copy-Item (Join-Path $cssNoticeRoot 'BUILD-INFO.txt') $cssLicenseDir -Force
          Copy-Item (Join-Path $cssNoticeRoot 'libdvdcss-1.6.0-source.tar.xz') $cssLicenseDir -Force
          if (-not (Test-Path (Join-Path $ffDest 'libdvdcss-2.dll'))) { throw 'libdvdcss runtime was not staged beside FFmpeg' }

          $miArchive = Join-Path $work $miAsset
          Invoke-WebRequest -UseBasicParsing -Uri "https://mediaarea.net/download/binary/mediainfo/$miVersion/$miAsset" -OutFile $miArchive
          Assert-Sha $miArchive $miSha
          $miExtract = Join-Path $work 'mediainfo'
          Expand-Archive -LiteralPath $miArchive -DestinationPath $miExtract -Force
          $miExe = Get-ChildItem $miExtract -Filter MediaInfo.exe -File -Recurse | Select-Object -First 1
          if ($null -eq $miExe) { throw 'MediaInfo.exe missing from verified archive' }
          $miDest = Join-Path $stage 'mediainfo-26.05'
          New-Item -ItemType Directory -Force -Path $miDest | Out-Null
          Copy-Item $miExe.FullName (Join-Path $miDest 'MediaInfo.exe') -Force

          & (Join-Path $ffDest 'ffmpeg.exe') -hide_banner -demuxers | Select-String dvdvideo
          if ($LASTEXITCODE -ne 0) { throw 'Bundled FFmpeg self-check failed' }
          foreach ($name in @('ffmpeg.exe','ffprobe.exe')) {
            $protocols = & (Join-Path $ffDest $name) -hide_banner -protocols 2>&1
            if ($LASTEXITCODE -ne 0 -or -not ($protocols | Where-Object { $_.Trim() -eq 'bluray' })) {
              throw "Bundled $name lacks required libbluray protocol"
            }
          }

      - name: Build Windows portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ needs.metadata.outputs.version }}'
          New-Item -ItemType Directory -Force -Path .\dist | Out-Null
          $stage = Join-Path $PWD "dist\muKsMaTT-$version-Windows-Portable"
          $releaseZip = Join-Path $PWD "dist\muKsMaTT-$version-Windows-Portable.zip"
          $internalZip = Join-Path $PWD "dist\muKsMaTT-$version-Portable.zip"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $releaseZip,$internalZip -Force -ErrorAction SilentlyContinue

          $ffDest = Join-Path $stage 'muKsMaTTData\tools\ffmpeg-2026-09-08'
          $miDest = Join-Path $stage 'muKsMaTTData\tools\mediainfo-26.05'
          New-Item -ItemType Directory -Force -Path $ffDest,$miDest | Out-Null

          Copy-Item .\muksmatt.exe (Join-Path $stage 'muKsMaTT-Portable.exe') -Force
          Copy-Item .\muksmatt-cli.exe (Join-Path $stage 'muksmatt-cli.exe') -Force
          Copy-Item .\src\muksmatt.exe.manifest (Join-Path $stage 'muKsMaTT-Portable.exe.manifest') -Force
          Copy-Item .\src\muksmatt.ico (Join-Path $stage 'muksmatt.ico') -Force
          Copy-Item .\THIRD_PARTY.md (Join-Path $stage 'THIRD_PARTY.md') -Force
          Copy-Item .\packaging\installer\bundled-tools\ffmpeg-2026-09-08\* $ffDest -Recurse -Force
          Copy-Item .\packaging\installer\bundled-tools\mediainfo-26.05\MediaInfo.exe $miDest -Force
          Copy-Item .\packaging\installer\bundled-tools\bluray-nav\* $stage -Recurse -Force
          if (-not (Test-Path (Join-Path $stage 'muksmatt-bluray-nav.exe'))) {
            throw 'Portable Windows Blu-ray navigator is missing'
          }

          foreach ($required in @(
            (Join-Path $ffDest 'libdvdcss-2.dll'),
            (Join-Path $ffDest 'licenses\libdvdcss\COPYING'),
            (Join-Path $ffDest 'licenses\libdvdcss\BUILD-INFO.txt'),
            (Join-Path $ffDest 'licenses\libdvdcss\libdvdcss-1.6.0-source.tar.xz')
          )) {
            if (-not (Test-Path -LiteralPath $required)) {
              throw "Portable CSS runtime provenance is missing: $required"
            }
          }

          @(
            "muKsMaTT $version Portable",
            "=========================",
            "",
            "Extract this entire folder and run muKsMaTT-Portable.exe.",
            "The included muksmatt-cli.exe supports scan, metadata, remux, --batch, --streams, --title and --no-chapters.",
            "No installer is required and no FFmpeg, FFprobe, or MediaInfo download is required.",
            "",
            "Keep the folder together. Portable settings, logs, and bundled tools are stored under:",
            "  muKsMaTTData\"
          ) | Set-Content -LiteralPath (Join-Path $stage 'README-PORTABLE.txt') -Encoding UTF8

          $checksumPath = Join-Path $stage 'CHECKSUMS.txt'
          $lines = Get-ChildItem -LiteralPath $stage -File -Recurse |
            Where-Object { $_.FullName -ne $checksumPath } |
            Sort-Object FullName |
            ForEach-Object {
              $rel = $_.FullName.Substring($stage.Length + 1).Replace('\','/')
              $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
              "$hash  $rel"
            }
          $lines | Set-Content -LiteralPath $checksumPath -Encoding ASCII
          Compress-Archive -LiteralPath $stage -DestinationPath $releaseZip -CompressionLevel Optimal

          # Stage the portable archive under the filename consumed by the All-in-One builder.
          Copy-Item -LiteralPath $releaseZip -Destination $internalZip -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer and All-in-One
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ needs.metadata.outputs.version }}'
          $numericVersion = '${{ needs.metadata.outputs.windows_numeric_version }}'
          $issPath = '.\packaging\installer\muKsMaTT.iss'

          $iss = Get-Content -LiteralPath $issPath -Raw
          $needle = 'VersionInfoVersion={#MyAppVersion}.0'
          if (-not $iss.Contains($needle)) {
            throw 'Inno Setup version declaration changed; update unified release workflow.'
          }
          $iss = $iss.Replace($needle, "VersionInfoVersion=$numericVersion")
          Set-Content -LiteralPath $issPath -Value $iss -Encoding UTF8 -NoNewline

          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($null -eq $cmd) { throw 'Inno Setup compiler (ISCC.exe) was not found.' }
            $iscc = $cmd.Source
          }

          & $iscc "/DMyAppVersion=$version" $issPath
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed with exit code $LASTEXITCODE" }
          $setup = ".\dist\muKsMaTT-$version-Setup.exe"
          $releaseSetup = ".\dist\muKsMaTT-$version-Windows-Setup.exe"
          if (-not (Test-Path -LiteralPath $setup)) { throw "Missing installer: $setup" }
          Move-Item -LiteralPath $setup -Destination $releaseSetup -Force

          $aioScript = '.\packaging\all-in-one\Build-AllInOne.ps1'
          & $aioScript -AppVersion $version
          if ($LASTEXITCODE -ne 0) { throw "All-in-One build failed with exit code $LASTEXITCODE" }
          $aio = ".\dist\muKsMaTT-$version-All-in-One.exe"
          $releaseAio = ".\dist\muKsMaTT-$version-Windows-All-in-One.exe"
          if (-not (Test-Path -LiteralPath $aio)) { throw "Missing All-in-One executable: $aio" }
          Move-Item -LiteralPath $aio -Destination $releaseAio -Force

          Remove-Item ".\dist\muKsMaTT-$version-Portable.zip" -Force -ErrorAction SilentlyContinue

      - name: Create Windows checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ needs.metadata.outputs.version }}'
          $assets = @(
            ".\dist\muKsMaTT-$version-Windows-Setup.exe",
            ".\dist\muKsMaTT-$version-Windows-All-in-One.exe",
            ".\dist\muKsMaTT-$version-Windows-Portable.zip"
          )
          $lines = foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset)) { throw "Missing release asset: $asset" }
            $item = Get-Item -LiteralPath $asset
            if ($item.Length -le 0) { throw "Empty release asset: $asset" }
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $asset).Hash.ToLowerInvariant()
            "$hash  $($item.Name)"
          }
          $lines | Set-Content -LiteralPath .\dist\SHA256SUMS-Windows.txt -Encoding ASCII

      - name: Upload Windows release payload
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          if-no-files-found: error
          path: |
            dist/muKsMaTT-${{ needs.metadata.outputs.version }}-Windows-Setup.exe
            dist/muKsMaTT-${{ needs.metadata.outputs.version }}-Windows-All-in-One.exe
            dist/muKsMaTT-${{ needs.metadata.outputs.version }}-Windows-Portable.zip
            dist/SHA256SUMS-Windows.txt

  linux:
    needs: [metadata, signing-preflight]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.source_ref }}

      - name: Set up Go 1.27.1
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false

      - name: Install Linux build prerequisites
        run: |
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install -y \
            gcc g++ cmake meson ninja-build curl xz-utils file \
            libgl1-mesa-dev libgl1-mesa-dri libglx-mesa0 libegl-mesa0 xvfb xorg-dev libwayland-dev libxkbcommon-dev libbluray-dev libaacs0 libbdplus0 libudfread0 pkg-config
          # Match preinstalled transitive libraries to the current deb-src index.
          # Ubuntu removes superseded security sources from that index.
          sudo apt-get upgrade -y

      - name: Verify Go module metadata
        working-directory: src
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build Linux release payload
        run: |
          set -euo pipefail
          version='${{ needs.metadata.outputs.version }}'
          bash packaging/linux/build-linux-release.sh "$version"
          bash packaging/linux/build-linux-standalone.sh "$version"

      - name: Validate Linux packages
        run: |
          set -euo pipefail
          version='${{ needs.metadata.outputs.version }}'
          deb="dist/linux-release/muKsMaTT-$version-Linux-amd64.deb"
          standalone="dist/linux-release/muKsMaTT-$version-Linux-amd64Standalone"

          dpkg-deb --info "$deb"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          dpkg-deb --extract "$deb" "$tmp"
          test -x "$tmp/usr/bin/muksmatt"
          test -x "$tmp/usr/bin/muksmatt-cli"
          test -x "$tmp/usr/lib/muksmatt/ffmpeg-bin/ffmpeg"
          test -x "$tmp/usr/lib/muksmatt/ffprobe-bin/ffprobe" || test -x "$tmp/usr/lib/muksmatt/ffmpeg-bin/ffprobe"
          test -x "$tmp/usr/lib/muksmatt/mediainfo-bin/mediainfo"
          test -e "$tmp/usr/lib/muksmatt/ffmpeg-bin/libdvdcss.so.2"
          test -s "$tmp/usr/share/doc/muksmatt/libdvdcss-1.6.0-source.tar.xz"
          test -x "$tmp/usr/lib/muksmatt/app/muksmatt-bluray-nav"
          test "$("$tmp/usr/lib/muksmatt/app/muksmatt-bluray-nav" --version)" = "MUKSMATT_BD_NAV_1"

          test -x "$standalone"
          file "$standalone" | grep -E 'ELF 64-bit.*x86-64'
          cache="$(mktemp -d)"
          XDG_CACHE_HOME="$cache" "$standalone" --standalone-self-test
          python3 packaging/linux/test-standalone-libs.py
          bash packaging/linux/test-standalone-clean.sh "$standalone"
          rm -rf "$cache"

      - name: Create Linux checksums
        run: |
          set -euo pipefail
          cd dist/linux-release
          sha256sum ./*.deb ./*.tar.gz ./*Standalone > SHA256SUMS-Linux.txt
          rm -f SHA256SUMS.txt

      - name: Upload Linux release payload
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          if-no-files-found: error
          path: |
            dist/linux-release/*.deb
            dist/linux-release/*.tar.gz
            dist/linux-release/*Standalone
            dist/linux-release/SHA256SUMS-Linux.txt

  android:
    needs: [metadata, signing-preflight]
    runs-on: ubuntu-latest
    environment: android-release
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.source_ref }}

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake meson ninja-build binutils curl patchelf xz-utils autoconf automake libtool pkg-config ffmpeg dvdauthor genisoimage libavformat-dev libavcodec-dev libavutil-dev
          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Require Android app-signing secrets and certificate pin
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_APP_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_APP_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_APP_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_APP_SIGNING_KEY_PASSWORD }}
          CERT_SHA256: ${{ vars.ANDROID_APP_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo 'Missing ANDROID_APP_SIGNING_KEYSTORE_BASE64' >&2; exit 1; }
          test -n "$STORE_PASSWORD" || { echo 'Missing ANDROID_APP_SIGNING_STORE_PASSWORD' >&2; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Missing ANDROID_APP_SIGNING_KEY_ALIAS' >&2; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing ANDROID_APP_SIGNING_KEY_PASSWORD' >&2; exit 1; }
          test -n "$CERT_SHA256" || { echo 'Missing Actions variable ANDROID_APP_SIGNING_CERT_SHA256' >&2; exit 1; }

      - name: Prepare and verify Android app-signing identity
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_APP_SIGNING_KEYSTORE_BASE64 }}
          MATTRIP_SIGNING_KEYSTORE: ${{ runner.temp }}/muksmatt-app-signing.jks
          MATTRIP_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_APP_SIGNING_STORE_PASSWORD }}
          MATTRIP_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_APP_SIGNING_KEY_ALIAS }}
          MATTRIP_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_APP_SIGNING_KEY_PASSWORD }}
          MATTRIP_EXPECTED_CERT_SHA256: ${{ vars.ANDROID_APP_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$MATTRIP_SIGNING_KEYSTORE"
          bash scripts/android-signing-preflight.sh "muKsMaTT app-signing key"

      - name: Test native seekable Blu-ray ISO block reader on host
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2             android/native/bluray_saf_blocks.c android/native/tests/bluray_saf_blocks_test.c             -o "$RUNNER_TEMP/bluray-saf-blocks-test"
          "$RUNNER_TEMP/bluray-saf-blocks-test"

      - name: Build bundled LGPL FFmpeg runtime
        run: |
          ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" \
            bash android/native/build-ffmpeg-android.sh

      - name: Test UDF reads and production JNI remux parity
        run: |
          python3 -m pip install pycdlib==1.14.0
          bash android/native/tests/test-udf-source.sh "$PWD/android/native/.work/libudfread"
          bash android/native/tests/test-host-remux.sh "$PWD/android/native/.work/libudfread" "$RUNNER_TEMP/remux-parity"
          bash android/native/tests/test-title-selection.sh "$PWD/android/native/.work" "$RUNNER_TEMP/title-selection"

      - name: Test, lint and build signed versioned APK
        env:
          ORG_GRADLE_PROJECT_MATTRIP_SIGNING_STORE_FILE: ${{ runner.temp }}/muksmatt-app-signing.jks
          ORG_GRADLE_PROJECT_MATTRIP_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_APP_SIGNING_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_MATTRIP_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_APP_SIGNING_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_MATTRIP_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_APP_SIGNING_KEY_PASSWORD }}
        run: |
          gradle -p android \
            -PMATTRIP_VERSION_NAME='${{ needs.metadata.outputs.version }}' \
            -PMATTRIP_VERSION_CODE='${{ needs.metadata.outputs.android_version_code }}' \
            -PMATTRIP_REQUIRE_SIGNING=true \
            :app:testDebugUnitTest :app:lintRelease :app:assembleRelease

      - name: Verify version and bundled native libraries
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.metadata.outputs.version }}'
          version_code='${{ needs.metadata.outputs.android_version_code }}'
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' -print -quit)"
          test -n "$APK"

          BADGING="$("${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging "$APK")"
          grep -Fq "versionCode='$version_code'" <<<"$BADGING"
          grep -Fq "versionName='$version'" <<<"$BADGING"

          python3 android/native/verify-package.py "$APK"
          build_info="$(unzip -p "$APK" assets/ffmpeg/ffmpeg-build-info.txt)"
          grep -q 'FFmpeg version: 9.0.1' <<<"$build_info"
          grep -q 'CSS support: libdvdcss 1.6.0' <<<"$build_info"
          "${ANDROID_HOME}/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/muksmatt-apksigner.txt
          ! grep -Fq "CN=Android Debug" /tmp/muksmatt-apksigner.txt
          bash scripts/verify-android-signing-cert.sh \
            "$APK" \
            '${{ vars.ANDROID_APP_SIGNING_CERT_SHA256 }}' \
            "${ANDROID_HOME}/build-tools/36.0.0/apksigner"

      - name: Prepare Android / ChromeOS release payload
        run: |
          set -euo pipefail
          version='${{ needs.metadata.outputs.version }}'
          mkdir -p dist/android-release
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' -print -quit)"

          cp "$APK" "dist/android-release/muKsMaTT-$version-Android.apk"
          test -s "dist/android-release/muKsMaTT-$version-Android.apk"
          cp "android/native/.work/ffmpeg-${FFMPEG_VERSION}.tar.xz" "dist/android-release/FFmpeg-${FFMPEG_VERSION}-source.tar.xz"
          cp android/native/.work/libudfread-1.1.2-source.tar.gz dist/android-release/
          cp android/native/.work/MediaInfoLib-source.tar.gz android/native/.work/ZenLib-source.tar.gz dist/android-release/
          cp android/app/src/main/assets/ffmpeg/*-License.* dist/android-release/
          cp android/app/src/main/assets/ffmpeg/NDK-NOTICE.txt dist/android-release/
          cp android/app/src/main/assets/ffmpeg/LIBUDFREAD_COPYING.txt dist/android-release/
          cp android/app/src/main/assets/ffmpeg/LIBBLURAY_COPYING.txt dist/android-release/
          cp android/app/src/main/assets/ffmpeg/LIBBLURAY_UDFREAD_COPYING.txt dist/android-release/
          cp android/native/.work/libudfread-1.2.0.tar.xz dist/android-release/
          cp android/native/.work/libbluray-1.5.0.tar.xz dist/android-release/
          cp android/app/src/main/assets/ffmpeg/ffmpeg-build-info.txt dist/android-release/FFmpeg-build-info.txt
          cp android/app/src/main/assets/ffmpeg/COPYING.LGPLv2.1 dist/android-release/COPYING.LGPLv2.1.txt
          cp android/app/src/main/assets/ffmpeg/FFMPEG_LICENSE.md dist/android-release/

          (
            cd dist/android-release
            sha256sum ./* > SHA256SUMS-Android.txt
          )

      - name: Upload Android / ChromeOS release payload
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          if-no-files-found: error
          path: dist/android-release/*

  android-startup:
    needs: [metadata, android]
    uses: ./.github/workflows/android-startup.yml
    with:
      artifact: release-android
      source-ref: ${{ needs.metadata.outputs.source_ref }}

  publish:
    needs: [metadata, windows, linux, android, android-startup]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.metadata.outputs.source_ref }}

      - name: Download all platform payloads
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Add project notices and combined checksums
        run: |
          set -euo pipefail
          version='${{ needs.metadata.outputs.version }}'
          cp THIRD_PARTY.md "release-assets/muKsMaTT-$version-THIRD-PARTY.md"

          (
            cd release-assets
            find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS.txt
          )

      - name: Require every platform and package variant
        run: |
          python3 scripts/check-release-assets.py release-assets '${{ needs.metadata.outputs.version }}'
          (cd release-assets && sha256sum -c SHA256SUMS.txt)

      - name: Refuse to overwrite an existing numbered release
        if: ${{ needs.metadata.outputs.mode == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ needs.metadata.outputs.tag }}'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists. Published numbered tags/assets are immutable." >&2
            exit 1
          fi

      - name: Publish one cross-platform numbered GitHub Release
        if: ${{ needs.metadata.outputs.mode == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ needs.metadata.outputs.tag }}'
          version='${{ needs.metadata.outputs.version }}'
          prerelease='${{ needs.metadata.outputs.prerelease }}'

          args=(
            release create "$tag"
            release-assets/*
            --repo "$GITHUB_REPOSITORY"
            --verify-tag
            --target "$(git rev-parse HEAD)"
            --title "muKsMaTT $version"
            --generate-notes
            --latest=false
          )
          if [[ "$prerelease" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"

      - name: Add stable filenames to the complete main snapshot
        if: ${{ needs.metadata.outputs.mode == 'main' }}
        run: |
          set -euo pipefail
          version='${{ needs.metadata.outputs.version }}'
          cp "release-assets/muKsMaTT-$version-Windows-All-in-One.exe" release-assets/muKsMaTT-Windows-All-in-One.exe
          cp "release-assets/muKsMaTT-$version-Linux-amd64Standalone" release-assets/muKsMaTT-Linux-amd64Standalone
          cp "release-assets/muKsMaTT-$version-Android.apk" release-assets/muKsMaTT-Android.apk
          (
            cd release-assets
            find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - name: Publish complete main snapshot and switch downloads
        if: ${{ needs.metadata.outputs.mode == 'main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_main.py
