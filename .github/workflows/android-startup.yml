name: Android startup validation

on:
  workflow_call:
    inputs:
      artifact:
        required: true
        type: string
      test-artifact:
        required: false
        type: string
        default: ''
      source-ref:
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            target: google_apis
            page-size: 4096
          - api: 35
            target: google_apis
            page-size: 4096
          - api: 35
            target: google_apis_ps16k
            page-size: 16384
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: startup-apk
      - uses: actions/download-artifact@v4
        if: ${{ inputs.test-artifact != '' }}
        with:
          name: ${{ inputs.test-artifact }}
          path: startup-test-apk
      - name: Resolve application and optional instrumentation APKs
        shell: bash
        env:
          TEST_ARTIFACT: ${{ inputs.test-artifact }}
        run: |
          set -euo pipefail
          mapfile -t apps < <(find startup-apk -name '*.apk' -type f)
          test "${#apps[@]}" -eq 1
          echo "STARTUP_APK=${apps[0]}" >> "$GITHUB_ENV"
          if [[ -n "$TEST_ARTIFACT" ]]; then
            mapfile -t tests < <(find startup-test-apk -name '*.apk' -type f)
            test "${#tests[@]}" -eq 1
            echo "STARTUP_TEST_APK=${tests[0]}" >> "$GITHUB_ENV"
          fi
      - name: Test startup UI recognition
        run: python3 -m unittest discover -s android/scripts -p 'test_startup*.py' -v
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch APK and exercise tabs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          heap-size: 512M
          script: python3 android/scripts/startup_runner.py "$STARTUP_APK" startup-logs --page-size ${{ matrix.page-size }} ${STARTUP_TEST_APK:+--test-apk "$STARTUP_TEST_APK"}
      - name: Preserve startup diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: startup-${{ matrix.api }}-${{ matrix.target }}-${{ inputs.artifact }}
          path: startup-logs
          if-no-files-found: ignore
